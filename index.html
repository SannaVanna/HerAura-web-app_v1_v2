  <body class="bg-[#faf7f7] text-[#2d2d2d] antialiased selection:bg-pink-200 selection:text-pink-900">
    <div id="root"></div>
    <script>
      // Gracefully prevent unhandled WebSocket rejections in iframe/preview sandbox
      window.addEventListener('unhandledrejection', function(event) {
        var str = (event && (event.reason ? (event.reason.message || String(event.reason)) : '')) + '';
        if (str.toLowerCase().indexOf('websocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
